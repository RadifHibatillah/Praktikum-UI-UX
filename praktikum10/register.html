<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 2 - Web Programming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header {
            margin-bottom: 10px;
        }
        
        .breadcrumb {
            color: #999;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #3498db;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .form-section {
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
        }
        
        .form-section h2 {
            font-size: 16px;
            margin-bottom: 20px;
            color: #333;
        }
        
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .form-group label {
            width: 150px;
            font-size: 14px;
            color: #333;
        }
        
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="date"],
        .form-group input[type="number"],
        .form-group select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }
        
        .form-group input[type="text"],
        .form-group input[type="email"] {
            width: 300px;
        }
        
        .form-group input[type="date"] {
            width: 150px;
        }
        
        .form-group input[type="number"] {
            width: 200px;
        }
        
        .form-group select {
            width: 200px;
        }
        
        .radio-group {
            display: flex;
            gap: 30px;
        }
        
        .radio-group label {
            width: auto;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .date-picker {
            position: relative;
            display: inline-block;
        }
        
        .calendar-btn {
            padding: 6px 12px;
            border: 1px solid #ccc;
            background-color: #e0e0e0;
            cursor: pointer;
            border-radius: 3px;
            margin-left: 5px;
        }
        
        .submit-btn {
            background-color: #d0d0d0;
            color: #333;
            padding: 10px 30px;
            border: 1px solid #999;
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            background-color: #c0c0c0;
        }
        
        .caption {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="breadcrumb">Registrasi / #S001</div>
            <h1>Seminar Rembulan #1 September 2017</h1>
        </div>
        
        <div class="form-section">
            <h2>Registrasi Seminar / Workshop</h2>
            
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" name="nama">
            </div>
            
            <div class="form-group">
                <label>Tempat Lahir</label>
                <input type="text" name="tempat_lahir">
            </div>
            
            <div class="form-group">
                <label>Tanggal Lahir</label>
                <div class="date-picker">
                    <input type="text" value="12 May 2016" style="width: 150px;">
                    <button class="calendar-btn">📅</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="laki-laki" checked>
                        Laki-Laki
                    </label>
                    <label>
                        <input type="radio" name="gender" value="perempuan">
                        Perempuan
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>
            
            <div class="form-group">
                <label>Status Peserta</label>
                <select name="status">
                    <option>Select</option>
                </select>
            </div>
            
            <div class="form-group">
                <label></label>
                <button class="submit-btn">Daftar</button>
            </div>
        </div>
        
        <div class="caption">Gambar: Halaman Form Registrasi Seminar esem.com</div>
    </div>
</body>
</html>
